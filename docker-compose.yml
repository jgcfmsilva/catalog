name: catalog

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }

services:
  db:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: catalog
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    logging: *logging
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://catalog:${POSTGRES_PASSWORD}@db:5432/catalog
      JWT_SECRET: ${JWT_SECRET}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      SEED_USERNAME: ${SEED_USERNAME}
      SEED_PASSWORD: ${SEED_PASSWORD}
      COVERS_DIR: /data/covers
    volumes:
      - ./api:/app
      - api-node-modules:/app/node_modules
      - covers:/data/covers
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s

  web:
    logging: *logging
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:4000
      PORT: 8090
    ports:
      - "0.0.0.0:${WEB_PORT:-8090}:8090"   # IPv4 only; restrict it to your reverse proxy with a host firewall rule
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules

volumes:
  db-data:
  covers:
  api-node-modules:
  web-node-modules:
